services:
  postgres:
    image: postgres:16.15
    environment:
      POSTGRES_USER: studymate
      POSTGRES_PASSWORD: studymate
      POSTGRES_DB: studymate
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U studymate -d studymate']
      interval: 2s
      timeout: 3s
      retries: 20
  postgres-test:
    image: postgres:16.15
    environment:
      POSTGRES_USER: studymate
      POSTGRES_PASSWORD: studymate
      POSTGRES_DB: studymate_test
    ports:
      - '127.0.0.1:5433:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U studymate -d studymate_test']
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
