global
    maxconn 48
    nbthread 1
    # Deliberately no log destination, payload inspection or TLS termination.

defaults
    mode tcp
    timeout connect 5s
    timeout client 120s
    timeout server 120s
    timeout queue 5s
    retries 1

resolvers public_dns
    # Never Docker DNS: domain aliases resolve to this gateway on the private net.
    nameserver cloudflare 1.1.1.1:53
    nameserver quad9 9.9.9.9:53
    accepted_payload_size 8192
    resolve_retries 2
    timeout resolve 2s
    timeout retry 1s
    hold valid 30s
    hold nx 5s

frontend allowed_tls
    bind :443
    tcp-request inspect-delay 5s
    acl client_hello req.ssl_hello_type 1
    acl allowed_sni req.ssl_sni -m str auth.openai.com chatgpt.com s3.cloud.ru
    tcp-request content reject if client_hello !allowed_sni
    tcp-request content accept if client_hello allowed_sni
    tcp-request content reject if WAIT_END
    use_backend openai_auth if { req.ssl_sni -m str auth.openai.com }
    use_backend chatgpt_model if { req.ssl_sni -m str chatgpt.com }
    use_backend retained_media if { req.ssl_sni -m str s3.cloud.ru }
    default_backend deny_all

backend deny_all
    tcp-request content reject

backend openai_auth
    server fixed auth.openai.com:443 resolvers public_dns init-addr none resolve-prefer ipv4 maxconn 8
backend chatgpt_model
    server fixed chatgpt.com:443 resolvers public_dns init-addr none resolve-prefer ipv4 maxconn 16
backend retained_media
    server fixed s3.cloud.ru:443 resolvers public_dns init-addr none resolve-prefer ipv4 maxconn 8

frontend fixed_postgres
    bind :5432
    default_backend postgres_only
backend postgres_only
    # Fixed operator-provided IP, not a client-selected destination/port.
    server fixed "${AI_DATABASE_FORWARD_IP}:5432" maxconn 3
