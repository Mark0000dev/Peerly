# OPT-IN ONLY: load after haproxy.cfg through otlp-entrypoint.sh.
# No access/payload logs. Trusted worker SDK metadata only; not a public ingestion API.
frontend fixed_otlp_http
    mode http
    bind "${AI_OTLP_BIND_IP}:4318"
    maxconn 4
    timeout client 2s
    timeout http-request 1s
    timeout http-keep-alive 100ms
    option httpclose
    acl otlp_method method POST
    acl otlp_host req.hdr(host) -i peerly-ai-otel:4318
    acl otlp_uri url -m str /v1/traces /v1/metrics
    acl one_host req.hdr_cnt(host) eq 1
    acl one_length req.hdr_cnt(content-length) eq 1
    acl decimal_length req.hdr(content-length) -m reg ^(0|[1-9][0-9]{0,6})$
    acl bounded_length req.hdr_val(content-length) le 1048576
    acl protobuf req.hdr(content-type) -m str application/x-protobuf
    acl one_content_type req.hdr_cnt(content-type) eq 1
    http-request deny deny_status 403 unless otlp_method otlp_host otlp_uri one_host
    http-request deny deny_status 400 unless one_length decimal_length
    http-request deny status 413 content-type text/plain string "Request denied" unless bounded_length
    http-request deny status 415 content-type text/plain string "Request denied" unless protobuf one_content_type
    http-request deny deny_status 400 if { req.hdr_cnt(transfer-encoding) gt 0 }
    http-request deny deny_status 400 if { req.hdr_cnt(content-encoding) gt 0 }
    http-request deny deny_status 403 if { req.hdr_cnt(authorization) gt 0 }
    http-request deny deny_status 403 if { req.hdr_cnt(proxy-authorization) gt 0 }
    http-request deny deny_status 403 if { req.hdr_cnt(cookie) gt 0 }
    http-request deny deny_status 403 if { req.hdr_cnt(upgrade) gt 0 }
    http-request set-header Host peerly-otel:4318
    http-request del-header Forwarded
    http-request del-header X-Forwarded-Host
    http-request del-header X-Forwarded-For
    http-request del-header X-Forwarded-Proto
    http-request del-header Accept-Encoding
    default_backend otlp_collector_only

backend otlp_collector_only
    mode http
    retries 0
    timeout connect 250ms
    timeout queue 250ms
    timeout server 2s
    option httpclose
    # Fixed reviewed collector IP; NO DNS, client-derived address or alternate port.
    server collector "${AI_OTLP_COLLECTOR_IP}:4318" maxconn 2 maxqueue 2
    # Prevent exporter redirect-following to a new origin.
    http-response return status 502 if { status 300:399 }
