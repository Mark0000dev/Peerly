# Merge ONLY into the existing protected read-gateway staging server block.
# Inherit /etc/nginx/read.htpasswd and the existing TLS/reader ingress route.
location = /peerly-observe/metrics/backup {
    limit_except GET { deny all; }
    alias /etc/nginx/backup-metrics/backup.prom;
    default_type text/plain;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}
