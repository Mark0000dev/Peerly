# Private monitoring stack; no Docker socket or privileged host mounts.
services:
  collector:
    image: otel/opentelemetry-collector-contrib:0.165.0@sha256:e40d61f10c9a617cca1ffd1be4d7e2b3a4b0f0001798ff07e58cabe82e618cea
    user: 10001:10001
    command:
    - --config=/etc/otelcol/collector.yaml
    environment:
      GOMEMLIMIT: 224MiB
      PEERLY_ENVIRONMENT: ${PEERLY_ENVIRONMENT:?Set the actual environment}
      LOKI_OTLP_ENDPOINT: ${LOKI_OTLP_ENDPOINT:?Inventory existing Loki OTLP endpoint
        first}
      LOKI_AUTHORIZATION: ${LOKI_AUTHORIZATION:-}
      LOKI_TENANT_ID: ${LOKI_TENANT_ID:-}
    volumes:
    - ./collector/collector.yaml:/etc/otelcol/collector.yaml:ro
    - ${PEERLY_COLLECTOR_DATA_DIR:?Precreate private directory owned by UID10001}:/var/lib/otelcol
    # Statfs only in collector namespace; same Tempo backing filesystem, no host root/proc/socket.
    - ${PEERLY_TEMPO_DATA_DIR:?Precreate private directory owned by UID10001}:/var/tempo-capacity:ro
    ports:
    - 127.0.0.1:${PEERLY_SYSLOG_PORT:-5514}:5514
    - 127.0.0.1:${PEERLY_METRICS_PORT:-8889}:8889
    - 127.0.0.1:${PEERLY_COLLECTOR_METRICS_PORT:-8888}:8888
    - 127.0.0.1:${PEERLY_COLLECTOR_HEALTH_PORT:-13133}:13133
    networks:
      telemetry: null
      application:
        aliases:
        - peerly-otel
      monitoring_egress: null
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    tmpfs:
    - '/tmp:rw,noexec,nosuid,nodev,size=16m'
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: 5m
        max-file: '2'
  tempo:
    image: grafana/tempo:3.1.1@sha256:64e2fbd56d9c2b3412a4b430a58ea59e91a670b1e75f920a0c702213ad145044
    user: 10001:10001
    command:
    - -target=all
    - -config.file=/etc/tempo/tempo.yaml
    environment:
      GOMEMLIMIT: 448MiB
    volumes:
    - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
    - ${PEERLY_TEMPO_DATA_DIR:?Precreate private directory owned by UID10001}:/var/tempo
    ports:
    - 127.0.0.1:${PEERLY_TEMPO_PORT:-3200}:3200
    networks:
    - telemetry
    - monitoring_egress
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    tmpfs:
    - '/tmp:rw,noexec,nosuid,nodev,size=32m'
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 128
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: 5m
        max-file: '2'
networks:
  telemetry:
    internal: true
  application:
    external: true
    name: ${PEERLY_APPLICATION_NETWORK:?Set actual API/worker private network}
  monitoring_egress:
    external: true
    name: ${PEERLY_MONITORING_EGRESS_NETWORK:?Set approved private/TLS egress network}
