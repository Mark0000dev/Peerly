worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
    access_log off;
    auth_basic "Peerly private telemetry";
    auth_basic_user_file /etc/nginx/read.htpasswd;
    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 1m;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    proxy_connect_timeout 2s;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;
    proxy_set_header Authorization "";
    proxy_set_header Host $proxy_host;
    server {
        listen 8080;
        server_name _;
        location = /healthz { auth_basic off; return 200 "ok\n"; }
        location = /peerly-observe/metrics/application {
            limit_except GET { deny all; }
            set $target http://collector:8889;
            proxy_pass $target/metrics;
        }
        location = /peerly-observe/metrics/collector {
            limit_except GET { deny all; }
            set $target http://collector:8888;
            proxy_pass $target/metrics;
        }
        location = /peerly-observe/metrics/tempo {
            limit_except GET { deny all; }
            set $target http://tempo:3200;
            proxy_pass $target/metrics;
        }
        location ^~ /peerly-observe/tempo/api/ {
            limit_except GET { deny all; }
            set $target http://tempo:3200;
            rewrite ^/peerly-observe/tempo(/api/.*)$ $1 break;
            proxy_pass $target$uri$is_args$args;
        }
        location = /peerly-observe/tempo/ready {
            limit_except GET { deny all; }
            set $target http://tempo:3200;
            proxy_pass $target/ready;
        }
        location / { return 404; }
    }
}
