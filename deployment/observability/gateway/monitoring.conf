worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 64; }
http {
    access_log off;
    auth_basic "Peerly private log ingestion";
    auth_basic_user_file /etc/nginx/logs.htpasswd;
    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 1m;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;
    proxy_send_timeout 10s;
    proxy_set_header Authorization "";
    proxy_set_header Host $proxy_host;
    server {
        listen 8080;
        server_name _;
        location = /healthz { auth_basic off; return 200 "ok\n"; }
        location = /peerly-ingest/staging/logs/v1/logs {
            limit_except POST { deny all; }
            set $target http://solvetutorials-loki:3100;
            proxy_pass $target/otlp/v1/logs;
        }
        location / { return 404; }
    }
}
