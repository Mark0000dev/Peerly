groups:
- name: peerly-technical
  interval: 30s
  rules:
  - alert: PeerlyTelemetryScrapeDown
    expr: up{job=~"peerly-app-metrics|peerly-collector|peerly-tempo"} == 0
    for: 2m
    labels:
      severity: critical
      owner: peerly-team
    annotations:
      summary: Peerly telemetry target is unavailable
      description: Check private connectivity, process health and storage. This is not proof of API business health.
        See OPS02 runbook.
      dashboard_uid: peerly-technical-v1
  - alert: PeerlyRestErrorRatio
    expr: '(sum by (deployment_environment_name) (rate(http_server_requests{http_response_status_code=~"5..",http_route!="/api/v1/events"}[5m]))

      / sum by (deployment_environment_name) (rate(http_server_requests{http_route!="/api/v1/events"}[5m])) > 0.05)

      and on (deployment_environment_name)

      sum by (deployment_environment_name) (increase(http_server_requests{http_route!="/api/v1/events"}[5m])) >=
      100

      '
    for: 10m
    labels:
      severity: warning
      owner: peerly-team
    annotations:
      summary: REST 5xx ratio exceeds 5% with at least 100 observations
      description: Check route/outcome metrics, then correlated traces and safe logs. Excludes the actual SSE route.
        See OPS02 runbook.
      dashboard_uid: peerly-technical-v1
  - alert: PeerlyRestP95Slow
    expr: 'histogram_quantile(0.95, sum by (le,deployment_environment_name) (rate(http_server_request_duration_bucket{http_route!="/api/v1/events"}[5m])))
      > 1

      and on (deployment_environment_name)

      sum by (deployment_environment_name) (increase(http_server_request_duration_count{http_route!="/api/v1/events"}[5m]))
      >= 100

      '
    for: 10m
    labels:
      severity: warning
      owner: peerly-team
    annotations:
      summary: REST p95 duration exceeds one second
      description: Inspect slow route templates and request traces; no SQL parameters or private payloads are collected.
        See OPS02 runbook.
      dashboard_uid: peerly-technical-v1
  - alert: PeerlyEmailAttemptsFailing
    expr: sum by (deployment_environment_name) (increase(worker_email_steps{outcome=~"failed|retry|storage_unavailable|unexpected_error"}[10m]))
      >= 3
    for: 5m
    labels:
      severity: warning
      owner: peerly-team
    annotations:
      summary: Verification email worker has repeated unsuccessful attempts
      description: Check SMTP connectivity/provider state using owner procedure. A successful attempt means service
        acceptance, not inbox delivery. Never export codes or recipient addresses.
      dashboard_uid: peerly-technical-v1
  - alert: PeerlyEmailWorkerNotObserved
    expr: absent(worker_email_steps{service_name="studymate-email-worker"}) or sum(increase(worker_email_steps{service_name="studymate-email-worker"}[5m]))
      == 0
    for: 2m
    labels:
      severity: critical
      owner: peerly-team
    annotations:
      summary: Email worker step telemetry is missing or stopped
      description: A missing counter is a visibility/worker-liveness symptom, not proof of email loss. Check exporter,
        worker process and last safe logs.
      dashboard_uid: peerly-technical-v1
  - alert: PeerlyAiQueueOld
    expr: worker_ai_queue_oldest > 300
    for: 5m
    labels:
      severity: warning
      owner: peerly-team
    annotations:
      summary: Oldest observed AI queue item exceeds five minutes
      description: Check isolated worker health and circuit. Core student flows must remain independent. Do not
        inspect prompts in telemetry.
      dashboard_uid: peerly-technical-v1
  - alert: PeerlyAiCircuitOpen
    expr: worker_ai_circuit_open > 0
    for: 2m
    labels:
      severity: warning
      owner: peerly-team
    annotations:
      summary: AI worker circuit is open
      description: Use the AI runtime runbook; no provider login, credentials or live inference is triggered by
        this alert.
      dashboard_uid: peerly-technical-v1
  - alert: PeerlyTelemetryExportFailed
    expr: sum by (deployment_environment_name) (increase({__name__=~"otelcol_exporter_send_failed_(spans|log_records)"}[5m]))
      > 0
    for: 2m
    labels:
      severity: warning
      owner: peerly-team
    annotations:
      summary: Collector failed to export telemetry
      description: Check Tempo/Loki readiness and persistent queues. Retries/queues are bounded and telemetry may
        be dropped; never report zero-loss guarantees.
      dashboard_uid: peerly-technical-v1
  - alert: PeerlyTelemetryQueueNearFull
    expr: otelcol_exporter_queue_size / otelcol_exporter_queue_capacity > 0.8
    for: 2m
    labels:
      severity: warning
      owner: peerly-team
    annotations:
      summary: Collector persistent queue exceeds 80% capacity
      description: Restore export connectivity and inspect disk headroom. Do not clear queues or shorten retention
        to silence this alert.
      dashboard_uid: peerly-technical-v1
  - alert: PeerlyTempoDiskHeadroomLow
    expr: node_filesystem_avail_bytes{peerly_storage="tempo"} / node_filesystem_size_bytes{peerly_storage="tempo"}
      < 0.15
    for: 5m
    labels:
      severity: critical
      owner: peerly-team
    annotations:
      summary: Tempo backing filesystem has less than 15% free capacity
      description: Expand approved storage or perform verified archive/retrieval procedure. Automatic trace expiry
        is disabled. Full disk can reject new traces; hot storage is finite.
      dashboard_uid: peerly-technical-v1
  - alert: PeerlyTempoCapacityTelemetryMissing
    expr: absent(node_filesystem_size_bytes{peerly_storage="tempo"})
    for: 10m
    labels:
      severity: warning
      owner: peerly-team
    annotations:
      summary: Tempo storage capacity monitoring has not been wired
      description: Parent must relabel the real approved filesystem exporter target. Do not interpret this bundle
        as monitoring-ready without that capacity signal.
      dashboard_uid: peerly-technical-v1
