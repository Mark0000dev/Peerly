name: Internal staging release

on:
  workflow_run:
    workflows: [Backend, Frontend image, Staging release quality]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact selected main image SHA; original promotion SHA for recovery
        required: true
        type: string
      operation:
        type: choice
        options: [promote, rollback, reconcile]
        default: promote
      recovery_attempt:
        description: Original promotion run-attempt, recovery only
        type: string
      reconcile_attempt:
        description: Exact unresolved run-attempt acknowledgment
        type: string
      compatible_schema:
        description: Explicit reviewed compatibility, recovery only (0060_report_triage)
        type: string

permissions:
  contents: read
  actions: read
  packages: read

concurrency:
  group: peerly-staging-stack4
  cancel-in-progress: false

jobs:
  quality:
    name: Release tool quality
    if: >-
      github.repository == 'Mark0000dev/Peerly' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == 'Mark0000dev/Peerly'))
    permissions:
      contents: read
    uses: ./.github/workflows/staging-release-quality.yml
  promote:
    needs: quality
    name: Promote internal staging through restricted SSH
    if: >-
      github.repository == 'Mark0000dev/Peerly' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == 'Mark0000dev/Peerly'))
    runs-on: ubuntu-24.04
    # Mark MUST enforce custom deployment branch policy main-only, no tags.
    # This if/main check is NOT a substitute for environment secret admission.
    environment: internal-staging
    timeout-minutes: 25
    steps:
      - name: Check out trusted main client without persistent credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 existing project pin
        with:
          ref: refs/heads/main
          persist-credentials: false
      - name: Submit one closed operation over pinned restricted SSH
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha || github.event.workflow_run.head_sha }}
          OPERATION: ${{ inputs.operation || 'promote' }}
          RECOVERY_ATTEMPT: ${{ inputs.recovery_attempt }}
          RECONCILE_ATTEMPT: ${{ inputs.reconcile_attempt }}
          COMPATIBLE_SCHEMA: ${{ inputs.compatible_schema }}
          PEERLY_STAGING_SSH_HOST: ${{ vars.PEERLY_STAGING_SSH_HOST }}
          PEERLY_STAGING_SSH_KNOWN_HOSTS: ${{ secrets.PEERLY_STAGING_SSH_KNOWN_HOSTS }}
          PEERLY_STAGING_SSH_PRIVATE_KEY: ${{ secrets.PEERLY_STAGING_SSH_PRIVATE_KEY }}
        run: python3 -m deployment.staging.release_ssh.client
      # No source scripts, deployment inputs, Env snapshots or artifacts uploaded.
      # No self-hosted runner or Portainer/provider key is available to this job.
