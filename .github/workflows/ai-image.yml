name: AI worker image

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      backend_image:
        description: Exact ghcr.io/mark0000dev/peerly-backend@sha256 digest
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ai-image-${{ github.sha }}
  cancel-in-progress: false

jobs:
  image:
    name: Build pinned native worker, offline smoke and publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
      image: ${{ steps.publish.outputs.image }}
    env:
      IMAGE_REPOSITORY: ghcr.io/mark0000dev/peerly-ai-worker
      SMOKE_CONTAINER: peerly-ai-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out the exact packaging commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Select and validate the base image and initialize temporary paths
        shell: bash
        env:
          REQUESTED_BACKEND_IMAGE: ${{ inputs.backend_image }}
        run: |
          set -euo pipefail
          python3 - <<'PYVALIDATE'
          import os
          import re
          from pathlib import Path
          backend_image = os.environ.get("REQUESTED_BACKEND_IMAGE", "")
          if not backend_image:
              backend_image = Path("backend/ai-base-image.txt").read_text(encoding="utf-8").strip()
          if re.fullmatch(r"ghcr\.io/mark0000dev/peerly-backend@sha256:[0-9a-f]{64}", backend_image) is None:
              raise SystemExit("backend_image must be the exact allowed backend repository and lowercase SHA256 digest")
          if re.fullmatch(r"[0-9a-f]{40}", os.environ["GITHUB_SHA"]) is None:
              raise SystemExit("The source must be a full commit SHA")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as environment:
              environment.write("BACKEND_IMAGE=" + backend_image + "\n")
          PYVALIDATE
          build_context=$(mktemp -d "$RUNNER_TEMP/peerly-ai-context.XXXXXX")
          printf '%s\n' \
            "DOCKER_CONFIG=$RUNNER_TEMP/peerly-ai-auth-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            "RECEIPT_DIRECTORY=$RUNNER_TEMP/peerly-ai-receipts" \
            "BUILD_CONTEXT=$build_context" >> "$GITHUB_ENV"

      - name: Authenticate for the immutable backend base
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          install -d -m 700 "$DOCKER_CONFIG"
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io \
            --username "$GITHUB_ACTOR" --password-stdin
          docker pull "$BACKEND_IMAGE"

      - name: Bind the immutable backend to its actual repository source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RECEIPT_DIRECTORY"
          python3 - <<'PYBASE'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          fmt = '{"Id":{{json .Id}},"Labels":{{json .Config.Labels}},"User":{{json .Config.User}}}'
          base = json.loads(subprocess.check_output([
              "docker", "image", "inspect", "--format", fmt, os.environ["BACKEND_IMAGE"],
          ], text=True, timeout=30))
          labels = base.get("Labels") or {}
          revision = labels.get("org.opencontainers.image.revision", "")
          source = labels.get("org.opencontainers.image.source", "")
          expected_source = os.environ["GITHUB_SERVER_URL"] + "/" + os.environ["GITHUB_REPOSITORY"]
          if re.fullmatch(r"[0-9a-f]{40}", revision) is None or revision == "0" * 40:
              raise RuntimeError("Immutable backend requires its actual nonzero source commit")
          # This single pinned artifact predates the repository rename to Peerly.
          # Trust its old source label only with the exact repository ID, digest and revision.
          legacy_base = (
              os.environ.get("GITHUB_REPOSITORY_ID") == "1444435281"
              and source.casefold() == "https://github.com/mark0000dev/studymate-ai"
              and os.environ["BACKEND_IMAGE"] == "ghcr.io/mark0000dev/peerly-backend@sha256:6b0ba9d3811ffe822d8c177424c3a65303bb4c3f5e5c7978c491b0fe3620788f"
              and revision == "0fccb4c0c4e122a52a21437f04160d00833725dd"
          )
          if source.casefold() != expected_source.casefold() and not legacy_base:
              raise RuntimeError("Immutable backend source repository is not the allowed repository")
          if re.fullmatch(r"sha256:[0-9a-f]{64}", base["Id"]) is None:
              raise RuntimeError("Immutable backend has no valid configuration identity")
          if base["User"] != "10001:10001":
              raise RuntimeError("Backend base must default to the approved UID10001 identity")
          receipt = {"base_image": os.environ["BACKEND_IMAGE"], "base_image_id": base["Id"],
                     "base_source_sha": revision, "base_source_repository": source}
          Path(os.environ["RECEIPT_DIRECTORY"], "base-identity.json").write_text(
              json.dumps(receipt, indent=2) + "\n", encoding="utf-8")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as environment:
              environment.write("BACKEND_SOURCE_SHA=" + revision + "\n")
              environment.write("BASE_IMAGE_ID=" + base["Id"] + "\n")
          PYBASE

      - name: Check out the exact inherited backend source separately
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ github.repository }}
          ref: ${{ env.BACKEND_SOURCE_SHA }}
          path: .peerly-ai-base-source
          persist-credentials: false
          fetch-depth: 1

      - name: Verify inherited source and minimum runtime contracts offline before build
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYVERIFY'
          import hashlib
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          # This reviewed probe is mounted read-only, never baked into the image.
          probe = r'''
          import ast
          import hashlib
          import inspect
          import json
          from dataclasses import fields
          from pathlib import Path

          ROOT = Path('/app')
          DIRECTORIES = ('src/studymate/domain/ai', 'src/studymate/application/ai',
                         'src/studymate/infrastructure/ai', 'src/studymate/infrastructure/observability')
          EXPLICIT = ('src/studymate/ai_worker.py', 'src/studymate/bootstrap.py',
                      'src/studymate/config.py')

          def ensure(condition, code):
              if not condition:
                  raise RuntimeError(code)

          def source_hashes():
              paths = {ROOT / name for name in EXPLICIT}
              for directory in DIRECTORIES:
                  discovered = set((ROOT / directory).rglob('*.py'))
                  ensure(bool(discovered), 'missing_inherited_source_directory')
                  paths.update(discovered)
              ensure(all(path.is_file() and not path.is_symlink()
                         and path.resolve().is_relative_to(ROOT.resolve()) for path in paths),
                     'nonregular_or_escaped_inherited_source')
              return {str(path.relative_to(ROOT)): hashlib.sha256(path.read_bytes()).hexdigest()
                      for path in sorted(paths)}

          def capabilities():
              from studymate.config import AiWorkerRuntimeConfiguration, AiWorkerSettings
              from studymate.infrastructure.ai import process
              from studymate.infrastructure.ai.runtime.acceptance import ReceiptExpectation, RuntimeReceipt, policy_digest
              from studymate.infrastructure.ai.runtime.factory import AiRuntimeConfiguration, create_ai_worker_runtime
              from studymate.infrastructure.ai.runtime.policy import InspectionPolicy, require_max_processes
              from studymate.infrastructure.ai.runtime.preflight import PinnedCli

              cli = PinnedCli(Path('/usr/local/lib/peerly-codex/vendor/x86_64-unknown-linux-musl/bin/codex'),
                              'codex-cli 0.167.0', 'cdcb45aaa01d0f14e298985e09465aebccd47f64ecd298aea44814af7b62bbda')
              overrides = InspectionPolicy(Path('/job'), Path('/job/auth')).overrides(cli)
              ensure('project_doc_max_bytes=0' in overrides, 'missing_project_doc_skip')
              default = policy_digest(cli)
              explicit40 = policy_digest(cli, max_processes=40)
              ensure(default == 'ee0382dae2d63e2bb64b1ee778cc15388aa8d58e21670cc8eb2f099a892a1bf8',
                     'default32_policy_changed')
              ensure(explicit40 == 'c619f1d2eec4daf5afa6182910519471c56ce53fc3c06073482506f7ef4ba8a7',
                     'explicit40_policy_changed')
              for value in (32, 40):
                  require_max_processes(value)
                  ensure(ReceiptExpectation(max_processes=value).max_processes == value,
                         'missing_receipt_resource_expectation')
              for invalid in (31, 41, True, None):
                  try:
                      require_max_processes(invalid)
                  except ValueError:
                      pass
                  else:
                      raise RuntimeError('unbounded_resource_contract')
              runtime_fields = {field.name: field for field in fields(AiRuntimeConfiguration)}
              ensure(runtime_fields['max_processes'].default == 32, 'factory_default_raised')
              config_field = AiWorkerRuntimeConfiguration.model_fields['max_processes']
              ensure(config_field.default == 32, 'settings_default_raised')
              for field in (config_field, RuntimeReceipt.model_fields['pids_max']):
                  ensure(any(getattr(meta, 'ge', None) == 32 for meta in field.metadata)
                         and any(getattr(meta, 'le', None) == 40 for meta in field.metadata),
                         'missing_bounded_resource_validation')
              ensure(AiWorkerSettings.model_config.get('env_file') is None, 'ambient_worker_env_file')
              ensure({'tracer', 'meter'}.issubset(inspect.signature(create_ai_worker_runtime).parameters),
                     'missing_owned_telemetry_factory_ports')
              bootstrap = ast.parse((ROOT / 'src/studymate/bootstrap.py').read_text())
              worker = next(node for node in bootstrap.body
                            if isinstance(node, ast.AsyncFunctionDef) and node.name == 'run_ai_worker')
              ensure(any(isinstance(node, ast.Call) and isinstance(node.func, ast.Name)
                         and node.func.id == 'create_ai_worker_runtime'
                         and {'tracer', 'meter'}.issubset({item.arg for item in node.keywords})
                         for node in ast.walk(worker)), 'missing_worker_sdk_composition')
              ensure(process.STOP_CONFIRM_SECONDS == 5, 'stop_confirmation_budget_changed')
              tree = ast.parse((ROOT / 'src/studymate/infrastructure/ai/process.py').read_text())
              stop = next(node for node in tree.body
                          if isinstance(node, ast.AsyncFunctionDef) and node.name == '_stop')
              ensure(any(isinstance(node, ast.While) for node in ast.walk(stop))
                     and any(isinstance(node, ast.Call) and isinstance(node.func, ast.Name)
                             and node.func.id == '_group_exists' for node in ast.walk(stop))
                     and any(isinstance(node, ast.Call) and isinstance(node.func, ast.Attribute)
                             and node.func.attr == 'timeout_at' for node in ast.walk(stop)),
                     'missing_bounded_group_disappearance_confirmation')
              return {'bounded_stop_seconds': 5, 'project_doc_max_bytes': 0, 'default_max_processes': 32,
                      'explicit_max_processes': 40, 'default_policy_sha256': default,
                      'explicit40_policy_sha256': explicit40, 'worker_sdk_composition': True,
                      'provider_or_containment_acceptance': False}

          hashes = source_hashes()
          manifest_sha = hashlib.sha256(json.dumps(hashes, sort_keys=True, separators=(',', ':')).encode()).hexdigest()
          print(json.dumps({'file_sha256': hashes, 'manifest_sha256': manifest_sha,
                            'capabilities': capabilities()}, sort_keys=True))
          '''
          directory = Path(os.environ["RECEIPT_DIRECTORY"])
          probe_path = directory / "inherited-probe.py"
          probe_path.write_text(probe, encoding="utf-8")
          source_root = Path(os.environ["GITHUB_WORKSPACE"], ".peerly-ai-base-source", "backend")
          directories = ("src/studymate/domain/ai", "src/studymate/application/ai",
                         "src/studymate/infrastructure/ai", "src/studymate/infrastructure/observability")
          paths = {source_root / name for name in ("src/studymate/ai_worker.py", "src/studymate/bootstrap.py", "src/studymate/config.py")}
          for name in directories:
              found = set((source_root / name).rglob("*.py"))
              if not found:
                  raise RuntimeError("Approved canonical checkout lacks required inherited sources")
              paths.update(found)
          if not all(path.is_file() and not path.is_symlink()
                     and path.resolve().is_relative_to(source_root.resolve()) for path in paths):
              raise RuntimeError("Canonical source must be regular files inside its approved checkout")
          expected = {str(path.relative_to(source_root)): hashlib.sha256(path.read_bytes()).hexdigest()
                      for path in sorted(paths)}
          result = subprocess.run([
              "docker", "run", "--rm", "--name", os.environ["SMOKE_CONTAINER"] + "-base",
              "--network", "none", "--no-healthcheck", "--read-only", "--cap-drop", "ALL",
              "--security-opt", "no-new-privileges", "--pids-limit", "64", "--memory", "256m", "--cpus", "1",
              "--env", "PYTHONDONTWRITEBYTECODE=1", "--env", "HOME=/nonexistent",
              "--mount", "type=bind,src=" + str(probe_path) + ",dst=/probe.py,readonly",
              "--entrypoint", "python", os.environ["BACKEND_IMAGE"], "/probe.py",
          ], capture_output=True, text=True, timeout=45)
          if len(result.stdout) + len(result.stderr) > 262144:
              raise RuntimeError("Inherited source inspection output exceeded bound")
          sys.stderr.write(result.stderr)
          result.check_returncode()
          actual = json.loads(result.stdout)
          if actual["file_sha256"] != expected:
              raise RuntimeError("Actual immutable backend code differs from its exact repository source")
          (directory / "inherited-source.json").write_text(json.dumps(actual, indent=2) + "\n", encoding="utf-8")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as environment:
              environment.write("INHERITED_SOURCE_SHA256=" + actual["manifest_sha256"] + "\n")
          PYVERIFY

      - name: Build the native image inheriting verified backend code only
        shell: bash
        run: |
          set -euo pipefail
          cp backend/Dockerfile.ai-worker "$BUILD_CONTEXT/Dockerfile"
          python3 - <<'PYCONTEXT'
          import os
          from pathlib import Path
          context = Path(os.environ["BUILD_CONTEXT"])
          if {path.name for path in context.iterdir()} != {"Dockerfile"}:
              raise RuntimeError("AI build context must contain only its Dockerfile")
          if any(line.lstrip().upper().startswith(("COPY ", "ADD "))
                 for line in (context / "Dockerfile").read_text().splitlines()):
              raise RuntimeError("AI application source overlays are forbidden")
          PYCONTEXT
          docker build --file "$BUILD_CONTEXT/Dockerfile" \
            --build-arg "BACKEND_IMAGE=$BACKEND_IMAGE" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.base.name=$BACKEND_IMAGE" \
            --label "dev.peerly.ai.base-source.sha=$BACKEND_SOURCE_SHA" \
            --label "dev.peerly.ai.inherited-source.sha256=$INHERITED_SOURCE_SHA256" \
            --tag "$IMAGE_REPOSITORY:staging-$GITHUB_SHA" "$BUILD_CONTEXT"

      - name: Verify inherited source and native pins offline without credentials
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYSMOKE'
          import hashlib
          import json
          import os
          import stat
          import subprocess
          import sys
          from pathlib import Path

          image = os.environ["IMAGE_REPOSITORY"] + ":staging-" + os.environ["GITHUB_SHA"]
          container = os.environ["SMOKE_CONTAINER"]
          directory = Path(os.environ["RECEIPT_DIRECTORY"])
          fmt = '{"Id":{{json .Id}},"User":{{json .Config.User}},"Cmd":{{json .Config.Cmd}},"Labels":{{json .Config.Labels}}}'
          built = json.loads(subprocess.check_output(["docker", "image", "inspect", "--format", fmt, image], text=True))
          if built["User"] != "10002:10002" or built["Cmd"] != ["python", "-m", "studymate.ai_worker"]:
              raise RuntimeError("Worker image lost its exact nonroot identity or application command")
          labels = built.get("Labels") or {}
          if (labels.get("dev.peerly.ai.base-source.sha") != os.environ["BACKEND_SOURCE_SHA"]
                  or labels.get("dev.peerly.ai.inherited-source.sha256") != os.environ["INHERITED_SOURCE_SHA256"]
                  or labels.get("org.opencontainers.image.base.name") != os.environ["BACKEND_IMAGE"]):
              raise RuntimeError("Built image lost its verified inherited-base provenance")
          if any(key in labels for key in ("dev.peerly.ai.runtime-patch.sha256", "dev.peerly.ai.runtime-policy.sha256")):
              raise RuntimeError("Obsolete source-overlay labels are not inherited-source provenance")
          expected = json.loads((directory / "inherited-source.json").read_text())
          actual = subprocess.run([
              "docker", "run", "--rm", "--name", container + "-source", "--network", "none",
              "--user", "10002:10002", "--read-only", "--cap-drop", "ALL", "--security-opt", "no-new-privileges",
              "--pids-limit", "64", "--memory", "256m", "--cpus", "1", "--env", "HOME=/nonexistent",
              "--mount", "type=bind,src=" + str(directory / "inherited-probe.py") + ",dst=/probe.py,readonly",
              "--entrypoint", "python", image, "/probe.py",
          ], capture_output=True, text=True, timeout=45)
          if len(actual.stdout) + len(actual.stderr) > 262144:
              raise RuntimeError("Final source inspection output exceeded bound")
          sys.stderr.write(actual.stderr)
          actual.check_returncode()
          inherited = json.loads(actual.stdout)
          if inherited != expected:
              raise RuntimeError("Native image modified verified inherited application source or contracts")
          native_root = "/usr/local/lib/peerly-codex/vendor/x86_64-unknown-linux-musl/"
          pins = {
              native_root + "bin/codex": "cdcb45aaa01d0f14e298985e09465aebccd47f64ecd298aea44814af7b62bbda",
              native_root + "codex-resources/bwrap": "77360cb751ccedc5971391444ac86a8a33c15b04d6b4a6fe45f5d25496e62c4c",
          }
          pin_script = "\n".join([
              "import hashlib,json,stat", "from pathlib import Path", "pins=" + repr(pins),
              "for name,expected in pins.items():",
              " path=Path(name)",
              " if path.is_symlink() or not path.is_file() or stat.S_IMODE(path.stat().st_mode)!=0o555: raise RuntimeError('native_layout')",
              " if hashlib.sha256(path.read_bytes()).hexdigest()!=expected: raise RuntimeError('native_digest')",
              "if not Path('" + native_root + "codex-path/rg').is_file() or Path('/usr/bin/bwrap').exists(): raise RuntimeError('native_resource_layout')",
              "print(json.dumps({'native_pins':pins,'resource_layout_verified':True}))",
          ])
          pinned = subprocess.run([
              "docker", "run", "--rm", "--name", container + "-pins", "--network", "none",
              "--user", "10002:10002", "--read-only", "--cap-drop", "ALL", "--security-opt", "no-new-privileges",
              "--pids-limit", "64", "--memory", "256m", "--cpus", "1", "--entrypoint", "python", image, "-c", pin_script,
          ], capture_output=True, text=True, timeout=45)
          sys.stderr.write(pinned.stderr)
          pinned.check_returncode()
          pin_receipt = json.loads(pinned.stdout)
          subprocess.run([
              "docker", "create", "--name", container, "--network", "none", "--user", "10002:10002", "--read-only",
              "--tmpfs", "/tmp:rw,noexec,nosuid,nodev,size=64m,uid=10002,gid=10002,mode=0700",
              "--cap-drop", "ALL", "--security-opt", "no-new-privileges", "--pids-limit", "64", "--memory", "256m", "--cpus", "1",
              "--env", "HOME=/tmp", "--env", "CODEX_HOME=/tmp/codex", "--entrypoint", native_root + "bin/codex", image, "--version",
          ], check=True)
          result = subprocess.run(["docker", "start", "--attach", container], capture_output=True, text=True, timeout=45)
          sys.stdout.write(result.stdout)
          sys.stderr.write(result.stderr)
          result.check_returncode()
          version = "codex-cli 0.167.0"
          if result.stdout.strip() != version:
              raise RuntimeError("Native executable returned an unexpected pinned version")
          fmt = '{"Image":{{json .Image}},"ExitCode":{{json .State.ExitCode}},"OOMKilled":{{json .State.OOMKilled}},"User":{{json .Config.User}},"RootRO":{{json .HostConfig.ReadonlyRootfs}},"Network":{{json .HostConfig.NetworkMode}},"Caps":{{json .HostConfig.CapDrop}}}'
          details = json.loads(subprocess.check_output(["docker", "inspect", "--format", fmt, container], text=True))
          if (details["ExitCode"] != 0 or details["OOMKilled"] or details["Image"] != built["Id"]
                  or details["User"] != "10002:10002" or not details["RootRO"]
                  or details["Network"] != "none" or details["Caps"] != ["ALL"]):
              raise RuntimeError("Native version smoke did not use the exact bounded nonroot offline image")
          identity = json.loads((directory / "base-identity.json").read_text())
          receipt = {"schema_version": 2, "image": image, "source_sha": os.environ["GITHUB_SHA"],
                     "image_id": built["Id"], **identity, "native_version": version,
                     "user": "10002:10002", "read_only": True, "network": "none",
                     "runtime_overlay_applied": False, "inherited_manifest_sha256": inherited["manifest_sha256"],
                     "inherited_source_sha256": inherited["file_sha256"], "runtime_contracts": inherited["capabilities"],
                     **pin_receipt, "inference_executed": False, "containment_proven": False,
                     "provider_accepted": False}
          (directory / "smoke.json").write_text(json.dumps(receipt, indent=2) + "\n", encoding="utf-8")
          PYSMOKE

      - name: Publish the smoked commit image and record the registry digest
        id: publish
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          install -d -m 700 "$DOCKER_CONFIG"
          python3 - <<'PY'
          import base64
          import json
          import os
          import re
          import subprocess
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          repository = "mark0000dev/peerly-ai-worker"
          sha = os.environ["GITHUB_SHA"]
          if re.fullmatch(r"[0-9a-f]{40}", sha) is None:
              raise RuntimeError("Publishing requires the exact full commit SHA")
          tag = "staging-" + sha
          image = os.environ["IMAGE_REPOSITORY"] + ":" + tag
          credential = os.environ["GITHUB_TOKEN"]
          subprocess.run(["docker", "login", "ghcr.io", "--username", os.environ["GITHUB_ACTOR"],
                          "--password-stdin"], input=credential + "\n", text=True, check=True)
          subprocess.run(["docker", "push", image], check=True)
          basic = base64.b64encode((os.environ["GITHUB_ACTOR"] + ":" + credential).encode()).decode()
          query = urllib.parse.urlencode({"service": "ghcr.io", "scope": "repository:" + repository + ":pull,push"})
          request = urllib.request.Request("https://ghcr.io/token?" + query,
                                           headers={"Authorization": "Basic " + basic})
          with urllib.request.urlopen(request, timeout=30) as response:
              token = json.load(response)["token"]
          manifest_url = "https://ghcr.io/v2/" + repository + "/manifests/" + tag
          headers = {"Authorization": "Bearer " + token,
                     "Accept": "application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json"}
          with urllib.request.urlopen(urllib.request.Request(manifest_url, headers=headers), timeout=30) as response:
              digest = response.headers.get("Docker-Content-Digest", "")
              manifest = json.load(response)
          if re.fullmatch(r"sha256:[0-9a-f]{64}", digest) is None:
              raise RuntimeError("Registry did not return an actual immutable digest")
          directory = Path(os.environ["RECEIPT_DIRECTORY"])
          smoke = json.loads((directory / "smoke.json").read_text(encoding="utf-8"))
          if manifest.get("config", {}).get("digest") != smoke["image_id"]:
              raise RuntimeError("Published manifest does not reference the smoked image configuration")
          reference = os.environ["IMAGE_REPOSITORY"] + "@" + digest
          receipt = {"source_sha": sha, "tag": image, "digest": digest, "image": reference,
                     "smoked_image_id": smoke["image_id"],
                     "base_image": smoke["base_image"], "base_image_id": smoke["base_image_id"],
                     "base_source_sha": smoke["base_source_sha"], "native_version": smoke["native_version"],
                     "schema_version": 2, "runtime_overlay_applied": False,
                     "inherited_manifest_sha256": smoke["inherited_manifest_sha256"],
                     "inherited_source_sha256": smoke["inherited_source_sha256"],
                     "runtime_contracts": smoke["runtime_contracts"], "native_pins": smoke["native_pins"],
                     "resource_layout_verified": smoke["resource_layout_verified"]}
          (directory / "published.json").write_text(json.dumps(receipt, indent=2) + "\n", encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("digest=" + digest + "\nimage=" + reference + "\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("AI worker image published after immutable-base source comparison and offline native version smoke.\n\n"
                            "Commit: `" + sha + "`\n\nTag: `" + image + "`\n\n"
                            "Digest reference: `" + reference + "`\n\n"
                            "Inherited backend source: `" + smoke["base_source_sha"] + "`\n\n"
                            "Inherited source manifest: `" + smoke["inherited_manifest_sha256"] + "`\n\n"
                            "No application source overlays. Packaging/version smoke only; no credentials, inference or sandbox readiness proven.\n")
          PY

      - name: Retain source, smoke and digest receipts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: ai-image-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ env.RECEIPT_DIRECTORY }}/*.json
          if-no-files-found: error
          retention-days: 14

      - name: Container diagnostics and temporary authentication cleanup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          trap 'if [ -n "${DOCKER_CONFIG:-}" ]; then rm -rf -- "$DOCKER_CONFIG"; fi; if [ -n "${BUILD_CONTEXT:-}" ]; then rm -rf -- "$BUILD_CONTEXT"; fi' EXIT
          for smoke_name in "$SMOKE_CONTAINER" "$SMOKE_CONTAINER-base" "$SMOKE_CONTAINER-source" "$SMOKE_CONTAINER-pins"; do
            container_id=$(docker ps --all --quiet --filter "name=^/$smoke_name$")
            if [ -n "$container_id" ]; then
              docker logs "$container_id"
              docker rm --force "$container_id"
            fi
          done
