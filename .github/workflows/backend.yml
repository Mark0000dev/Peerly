name: Backend

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  backend:
    name: Backend quality
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: studymate
          POSTGRES_PASSWORD: studymate
          POSTGRES_DB: studymate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U studymate -d studymate_test"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://studymate:studymate@localhost:5432/studymate_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.7'
          enable-cache: true
      - run: uv sync --locked
      - run: make check
      - run: uv run alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://studymate:studymate@localhost:5432/studymate_test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml
