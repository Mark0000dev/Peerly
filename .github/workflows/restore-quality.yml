name: Backup and restore tooling quality

on:
  workflow_dispatch:
  pull_request:
    paths:
      - deployment/restore/**
      - deployment/backup/**
      - backend/pyproject.toml
      - backend/uv.lock
      - .github/workflows/restore-quality.yml
  push:
    branches: [main]
    paths:
      - deployment/restore/**
      - deployment/backup/**
      - backend/pyproject.toml
      - backend/uv.lock
      - .github/workflows/restore-quality.yml

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.13.7'
      - name: Install locked tooling
        run: uv sync --locked --python 3.12
      - name: Apply inherited lint, formatting and strict type rules
        run: |
          uv run --no-sync ruff check --config ../deployment/restore/pyproject.toml ../deployment/restore ../deployment/backup
          uv run --no-sync ruff format --check --config ../deployment/restore/pyproject.toml ../deployment/restore ../deployment/backup
          uv run --no-sync mypy --config-file pyproject.toml --strict ../deployment/restore ../deployment/backup
      - name: Verify offline inventory, media and generated-command guards
        run: uv run --no-sync pytest -c pyproject.toml ../deployment/restore/tests ../deployment/backup/tests
