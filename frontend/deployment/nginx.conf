worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;
    server_tokens off;
    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    map $uri $asset_cache_control {
        default "no-cache";
        "~*-[a-z0-9_-]{8,}[.](?:js|mjs|css|woff2|svg|png|jpe?g|webp|ico)$" "public, max-age=31536000, immutable";
    }

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        add_header Cache-Control $asset_cache_control always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;

        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }

        location = / {
            try_files /index.html =404;
        }

        location = /index.csr.html {
            try_files $uri =404;
        }

        location = /assets/observation-release.json {
            try_files $uri =404;
        }

        # Same-origin /api routing belongs to the staging reverse proxy.
        location /api/ {
            return 404;
        }

        location ~* \.(?:js|mjs|css|woff2?|svg|png|jpe?g|webp|ico|map)$ {
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.csr.html;
        }
    }
}
