<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" width="240" height="200" role="img" aria-label="Study buddy reading a book"><style>
.blink{animation:blink 6s infinite;transform-box:fill-box;transform-origin:center}
.bob{animation:bob 3.2s ease-in-out infinite}
.float{animation:float 4s ease-in-out infinite}
.twinkle{animation:tw 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
