// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.1.1'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

// Use only the explicitly preflighted build-tools package for every Android module.
subprojects { nativeProject ->
    nativeProject.plugins.withId('com.android.application') {
        nativeProject.androidComponents.finalizeDsl { androidDsl ->
            androidDsl.compileSdk = 37
            androidDsl.compileSdkMinor = 0
            androidDsl.buildToolsVersion = '36.0.0'
        }
    }
    nativeProject.plugins.withId('com.android.library') {
        nativeProject.androidComponents.finalizeDsl { androidDsl ->
            androidDsl.compileSdk = 37
            androidDsl.compileSdkMinor = 0
            androidDsl.buildToolsVersion = '36.0.0'
        }
    }
}
